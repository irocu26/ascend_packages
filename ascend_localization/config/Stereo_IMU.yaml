%YAML:1.0

#--------------------------------------------------------------------------------------------
# Stereo-Inertial ORB-SLAM3 config
# Generated from Kalibr calibration (cam0 = left, cam1 = right)
#
# Kalibr convention:  T_cam_imu  = transform FROM imu TO cam  (R_ci, t_ci)
# ORB-SLAM3 convention: Tbc       = transform FROM cam TO imu  (inverse of T_cam_imu)
#
# T_cn_cnm1 (cam1 relative to cam0) is used directly as Stereo.T_c1_c0
#--------------------------------------------------------------------------------------------

# Camera model
Camera.type: "PinHole"

#--------------------------------------------------------------------------------------------
# Left camera (cam0) intrinsics
#--------------------------------------------------------------------------------------------
Camera.fx: 355.29625997213486
Camera.fy: 355.27357108439486
Camera.cx: 313.5985218716256
Camera.cy: 234.06306860717083

Camera.k1: -0.0036860041150273176
Camera.k2:  0.0017997772345785766
Camera.p1: -0.0001193263854368934
Camera.p2:  0.0001010892622216657
Camera.k3:  0.0

Camera.width:  640
Camera.height: 480
# Stereo-specific required parameters


ThDepth: 40.0              # ADD THIS — close/far point threshold
                           # = how many times the baseline a point
                           #   is considered "close"
                           # 40.0 is a safe default for 0.2m baseline
Camera.fps:    30.0
Camera.RGB:    1

#--------------------------------------------------------------------------------------------
# Right camera (cam1) intrinsics
#--------------------------------------------------------------------------------------------
Camera2.fx: 355.2776774692408
Camera2.fy: 355.2758733862329
Camera2.cx: 313.3996077212121
Camera2.cy: 234.11868963466821

Camera2.k1: -0.0027254297520276608
Camera2.k2:  0.0008631034482972852
Camera2.p1: -4.4991185815354995e-05
Camera2.p2:  0.00030656412249902113
Camera2.k3:  0.0

#--------------------------------------------------------------------------------------------
# Stereo baseline * fx  (bf = baseline_metres * fx)
# Baseline = |t| from T_cn_cnm1 translation = 0.19999712874426345 m
# bf = 0.19999712874426345 * 355.29625997213486 = 71.057
#--------------------------------------------------------------------------------------------
Camera.bf: 71.057

#--------------------------------------------------------------------------------------------
# Stereo rectification transform: cam1 relative to cam0
# Taken directly from Kalibr T_cn_cnm1
#--------------------------------------------------------------------------------------------
Stereo.T_c1_c0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [ 0.9999998346447911,  -1.5584335768059605e-05,  0.0005748630431846401,  0.19999712874426345,
            1.5667547896578422e-05,  0.9999999894014162, -0.0001447470035977348, -0.00017950036445018683,
           -0.0005748607813060006,  0.0001447559863573269,  0.9999998242903776,  -0.00014036228931639313,
            0.,                      0.,                      0.,                      1.]

#--------------------------------------------------------------------------------------------
# Left camera to IMU transform (Tbc)
# = inverse of Kalibr T_cam_imu for cam0
#
# Kalibr T_cam_imu (R_ci | t_ci):
#   R_ci = [[-0.009276, 0.999953,  0.002674],
#            [-0.999934,-0.009295,  0.006820],
#            [ 0.006844,-0.002611,  0.999973]]
#   t_ci = [-0.091306, 0.018829, 0.076775]
#
# Tbc = inverse:
#   R_bc = R_ci^T
#   t_bc = -R_ci^T * t_ci
#
# R_bc = R_ci^T:
#   [[-0.009276,-0.999934, 0.006844],
#    [ 0.999953,-0.009295,-0.002611],
#    [ 0.002674, 0.006820, 0.999973]]
#
# t_bc = -R_bc * t_ci:
#   tx = -( -0.009276*-0.091306 + -0.999934*0.018829 +  0.006844*0.076775)
#      = -( -0.000847  -0.018828 +  0.000525) = -(-0.019150) = 0.019150  ≈ 0.01915
#   ty = -(  0.999953*-0.091306 + -0.009295*0.018829 + -0.002611*0.076775)
#      = -( -0.091302  -0.000175 + -0.000200) = -(-0.091677) = 0.091677  ≈ 0.09168
#   tz = -(  0.002674*-0.091306 +  0.006820*0.018829 +  0.999973*0.076775)
#      = -( -0.000244 +  0.000128 +  0.076773) = -(0.076657) = -0.076657 ≈ -0.07666
#--------------------------------------------------------------------------------------------
Tbc: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [-0.009276, -0.999934,  0.006844,  0.01915,
           0.999953, -0.009295, -0.002611,  0.09168,
           0.002674,  0.006820,  0.999973, -0.07666,
           0.,         0.,        0.,        1.]

#--------------------------------------------------------------------------------------------
# IMU parameters
# (tuned for Gazebo/ArduPilot SITL simulated IMU)
#--------------------------------------------------------------------------------------------
IMU.Frequency:  333

IMU.NoiseGyro:  0.01
IMU.NoiseAcc:   0.1
IMU.GyroWalk:   0.001
IMU.AccWalk:    0.01

#--------------------------------------------------------------------------------------------
# ORB extractor
#--------------------------------------------------------------------------------------------
ORBextractor.nFeatures:   1000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels:     8
ORBextractor.iniThFAST:   20
ORBextractor.minThFAST:   7

#--------------------------------------------------------------------------------------------
# Viewer
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize:      0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth:    0.9
Viewer.PointSize:         2
Viewer.CameraSize:        0.08
Viewer.CameraLineWidth:   3
Viewer.ViewpointX:        0
Viewer.ViewpointY:       -0.7
Viewer.ViewpointZ:       -3.5
Viewer.ViewpointF:        500
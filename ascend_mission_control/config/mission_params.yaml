# ascend_mission_control/config/mission_params.yaml
# All tuneable parameters for the ASCEND FSM, survey planner, and monitor.
# Load with: --params-file $(find ascend_mission_control)/config/mission_params.yaml

ascend_fsm_node:
  ros__parameters:

    # ── Flight parameters ──────────────────────────────────────────────────
    survey_altitude:       3.0      # meters (rulebook: 2–6m, Section 10.3.5)
    wp_accept_radius:      0.4      # meters — waypoint considered reached within this
    low_battery_pct:       20.0     # % — trigger failsafe RTL below this
    # ADDED: now a ROS parameter (was class constant, not tunable at runtime)
    critical_battery_pct:  10.0     # % — trigger failsafe LAND below this

    # ── Arena dimensions ───────────────────────────────────────────────────
    arena_x_m:             10.67    # 35 ft
    arena_y_m:             7.62     # 25 ft

    # ── Mission parameters ─────────────────────────────────────────────────
    total_features:        3        # Features to find (rulebook Section 10.5.2)
    # ADDED: now a ROS parameter (was class constant MAX_SORTIES)
    max_sorties:           5        # Safety cap on repeat sorties
    hover_dwell_s:         1.5      # Seconds to hover before advancing waypoint
    match_hover_s:         2.0      # Seconds to hover for match verification

    # ── Survey coverage + speed (full-area SIFT sweep) ─────────────────────
    survey_strip_spacing:  1.0      # m between lawnmower rows — smaller = denser
                                    #   coverage of the WHOLE arena (not just edges)
    survey_speed:          0.4      # m/s horizontal — slow so SIFT can detect
    row_step:              1.0      # m between intermediate points along each row

    # ── Timeouts ───────────────────────────────────────────────────────────
    charge_timeout_s:      300.0    # Max wait for charging (5 min)
    transfer_timeout_s:    60.0     # Max wait for data transfer (1 min)
    arming_timeout_s:      10.0     # Max wait for arm confirmation
    link_timeout_s:        3.0      # Seconds without pose → lost-link failsafe

    # ── Mode ───────────────────────────────────────────────────────────────
    sim_mode:              true     # Set false for real hardware

survey_planner_node:
  ros__parameters:
    survey_altitude:       3.0
    strip_overlap:         0.3      # 30% strip overlap — ensures no gaps at 2–6m
    arena_x_m:             10.67
    arena_y_m:             7.62
    wp_radius:             0.4
    camera_hfov_deg:       90.0     # Horizontal FOV of drone camera

mission_monitor_node:
  ros__parameters:
    log_dir:               '/tmp/ascend_logs'
    # ADDED: must match ascend_fsm_node total_features for correct display
    total_features:        3

